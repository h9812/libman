<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        p {
            color: #666;
            line-height: 1.8;
            margin-bottom: 15px;
        }
        .links {
            margin-top: 30px;
            text-align: center;
        }
        .links a {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s;
        }
        .links a:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Hệ thống Quản lý Thư viện</h1>
        <p>Chào mừng bạn đến với ứng dụng quản lý thư viện!</p>
        <p>Đây là một ứng dụng web Java cơ bản được xây dựng với:</p>
        <ul style="color: #666; margin-left: 20px; line-height: 2;">
            <li>Java Servlet API</li>
            <li>JSP (JavaServer Pages)</li>
            <li>Maven để quản lý dependencies</li>
        </ul>
        <div class="links">
            <a href="home">Trang Home Servlet</a>
            <a href="index.jsp">Trang JSP</a>
        </div>
    </div>
</body>
</html>
